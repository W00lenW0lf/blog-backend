{% load static %}
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="icon" href="{% static 'img/favicon.png' %}" type="png">
  <link rel="stylesheet" href="{% static 'styles.min.css' %}">
  <title>Sensive Blog - {% block title %}{% endblock %}</title>
  {% block header %}
  {% endblock %}
</head>
<body>
  {% block content %}
  {% endblock %}
</body>
<footer>
  {% block footer %}
  {% endblock %}
</footer>
<script src="{% static 'scripts.js' %}"></script>
